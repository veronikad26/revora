services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - revora_data:/app/data
    environment:
      DATABASE_URL: sqlite:////app/data/revora.db
      DRY_RUN: "${DRY_RUN:-true}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  dashboard:
    build: .
    command: streamlit run dashboard/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      REVORA_API_URL: http://api:8000
    volumes:
      - ./evaluation:/app/evaluation
    depends_on:
      api:
        condition: service_healthy

  evaluator:
    build: .
    command: python -m evaluation.run_batch --count ${EVAL_COUNT:-100} --seed ${EVAL_SEED:-42} --output evaluation/results.json
    env_file:
      - .env
    volumes:
      - ./evaluation:/app/evaluation
    profiles: [evaluation]

volumes:
  revora_data: